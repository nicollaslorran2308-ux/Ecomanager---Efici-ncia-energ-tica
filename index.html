<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Clicker: Gerador de Energia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            color: #4ade80;
            font-size: 24px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .stats-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .energy-count {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
        }

        .energy-per-sec {
            font-size: 13px;
            color: #a7f3d0;
            margin-top: 4px;
        }

        .click-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            font-size: 48px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 6px 0 #047857;
            user-select: none;
            margin: 10px auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .click-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #047857;
        }

        .upgrades-title {
            text-align: left;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }

        .upgrade-btn {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #475569;
        }

        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info {
            text-align: left;
        }

        .upgrade-name {
            font-weight: bold;
            display: block;
        }

        .upgrade-desc {
            font-size: 11px;
            color: #94a3b8;
        }

        .upgrade-cost {
            font-weight: bold;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>⚡ Eco-Clicker</h1>
        <p class="subtitle">Gere energia limpa para a cidade!</p>

        <div class="stats-box">
            <div id="energy-display" class="energy-count">0 kWh</div>
            <div id="rate-display" class="energy-per-sec">+0 kWh por segundo</div>
        </div>

        <button id="click-button" class="click-btn">☀️</button>

        <div class="upgrades-title">Melhorias Automáticas</div>

        <button id="upg1" class="upgrade-btn" onclick="buyUpgrade(1)">
            <div class="upgrade-info">
                <span class="upgrade-name">Painel Solar (Qtd: <span id="count1">0</span>)</span>
                <span class="upgrade-desc">+1 kWh/s</span>
            </div>
            <span id="cost1" class="upgrade-cost">15 kWh</span>
        </button>

        <button id="upg2" class="upgrade-btn" onclick="buyUpgrade(2)">
            <div class="upgrade-info">
                <span class="upgrade-name">Turbina Eólica (Qtd: <span id="count2">0</span>)</span>
                <span class="upgrade-desc">+5 kWh/s</span>
            </div>
            <span id="cost2" class="upgrade-cost">100 kWh</span>
        </button>

        <button id="upg3" class="upgrade-btn" onclick="buyUpgrade(3)">
            <div class="upgrade-info">
                <span class="upgrade-name">Usina Geotérmica (Qtd: <span id="count3">0</span>)</span>
                <span class="upgrade-desc">+20 kWh/s</span>
            </div>
            <span id="cost3" class="upgrade-cost">500 kWh</span>
        </button>
    </div>

    <script>
        // ESTADO DO JOGO
        let energy = 0;
        let energyPerSecond = 0;

        const upgrades = {
            1: { count: 0, cost: 15, power: 1 },
            2: { count: 0, cost: 100, power: 5 },
            3: { count: 0, cost: 500, power: 20 }
        };

        // ELEMENTOS DA TELA
        const energyDisplay = document.getElementById('energy-display');
        const rateDisplay = document.getElementById('rate-display');
        const clickBtn = document.getElementById('click-button');

        // CLIQUE MANUAL
        clickBtn.addEventListener('click', () => {
            energy += 1;
            updateUI();
        });

        // COMPRAR MELHORIA
        function buyUpgrade(id) {
            const upg = upgrades[id];
            if (energy >= upg.cost) {
                energy -= upg.cost;
                upg.count += 1;
                energyPerSecond += upg.power;
                upg.cost = Math.floor(upg.cost * 1.5);
                updateUI();
            }
        }

        // ATUALIZAR INTERFACE
        function updateUI() {
            energyDisplay.innerText = Math.floor(energy) + " kWh";
            rateDisplay.innerText = "+" + energyPerSecond + " kWh por segundo";

            for (let id in upgrades) {
                const upg = upgrades[id];
                document.getElementById('count' + id).innerText = upg.count;
                document.getElementById('cost' + id).innerText = upg.cost + " kWh";
                document.getElementById('upg' + id).disabled = energy < upg.cost;
            }
        }

        // LOOP AUTOMÁTICO (a cada 1 segundo)
        setInterval(() => {
            energy += energyPerSecond;
            updateUI();
        }, 1000);

        // Inicializar a tela
        updateUI();
    </script>
</body>
</html>
