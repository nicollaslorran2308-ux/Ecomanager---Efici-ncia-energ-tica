<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoManager: Cidade Eficiente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-emerald-400">🍃 EcoManager</h1>
            <p class="text-xs text-slate-400">Gestão e Eficiência Energética</p>
        </div>

        <!-- Painel de Recursos (Consequências) -->
        <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400 block">Orçamento</span>
                <span id="ui-money" class="text-lg font-bold text-emerald-400">$1200</span>
            </div>
            <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400 block">Pontuação</span>
                <span id="ui-score" class="text-lg font-bold text-cyan-400">0</span>
            </div>
        </div>

        <!-- Caixa de Mensagem de Feedback -->
        <div id="ui-feedback" class="hidden text-center text-xs p-2.5 rounded font-medium transition-all"></div>

        <!-- Card do Quiz -->
        <div class="bg-slate-800/40 p-4 rounded-lg border border-slate-700/60 space-y-4">
            <div id="quiz-question" class="text-sm font-semibold text-slate-100 min-h-[40px] flex items-center">
                <!-- A pergunta será inserida aqui via JS -->
            </div>
            
            <div id="quiz-options" class="space-y-2">
                <!-- As opções serão inseridas aqui via JS -->
            </div>
        </div>

        <!-- Rodapé -->
        <div class="text-center text-[10px] text-slate-500 border-t border-slate-800 pt-3">
            Responda corretamente para ganhar fundos e manter a cidade no ar!
        </div>
    </div>

    <script>
        // --- ESTADO DO JOGO ---
        let money = 1200;
        let score = 0;
        let currentQuizIndex = 0;
        let gameActive = true;

        // --- BANCO DE DADOS DE PERGUNTAS ---
        const questions = [
            {
                question: "Qual destas ações ajuda a reduzir o consumo de energia em casa?",
                options: [
                    "Manter os aparelhos em modo de espera (standby)",
                    "Aproveitar a luz natural durante o dia",
                    "Ajustar o ar condicionado para temperaturas muito baixas",
                    "Usar a máquina de lavar roupa com pouca carga"
                ],
                correct: 1,
                reward: 200
            },
            {
                question: "Qual lâmpada é mais eficiente e económica para a cidade?",
                options: [
                    "Lâmpada Incandescente",
                    "Lâmpada Halogénea",
                    "Lâmpada LED",
                    "Lâmpada de Vapor de Sódio"
                ],
                correct: 2,
                reward: 250
            },
            {
                question: "Qual destas fontes é considerada limpa e renovável?",
                options: [
                    "Carvão mineral",
                    "Energia Solar",
                    "Petróleo",
                    "Gás Natural"
                ],
                correct: 1,
                reward: 300
            }
        ];

        // --- ATUALIZAR INTERFACE (UI) ---
        function updateUI() {
            document.getElementById("ui-money").innerText = "$" + money;
            document.getElementById("ui-score").innerText = score;
        }

        // --- EXIBIR PERGUNTA E OPÇÕES ---
        function renderQuiz() {
            const q = questions[currentQuizIndex];
            const questionEl = document.getElementById("quiz-question");
            const optionsEl = document.getElementById("quiz-options");

            questionEl.innerText = `${currentQuizIndex + 1}. ${q.question}`;
            optionsEl.innerHTML = "";

            q.options.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left text-xs p-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-slate-500 transition-all flex items-center gap-3 cursor-pointer";
                btn.innerHTML = `<span class="w-5 h-5 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center text-[10px] font-bold shrink-0">${index + 1}</span> <span>${optionText}</span>`;
                btn.onclick = () => checkAnswer(index);
                optionsEl.appendChild(btn);
            });
        }

        // --- PROCESSAR RESPOSTA E CONSEQUÊNCIAS ---
        function checkAnswer(selectedIndex) {
            if (!gameActive) return;

            const q = questions[currentQuizIndex];
            const feedbackEl = document.getElementById("ui-feedback");

            feedbackEl.classList.remove("hidden", "bg-emerald-500/20", "text-emerald-300", "border-emerald-500/30", "bg-rose-500/20", "text-rose-300", "border-rose-500/30");

            if (selectedIndex === q.correct) {
                // Consequência Positiva
                money += q.reward;
                score += 100;
                feedbackEl.innerText = `Correcto! A cidade ganhou +$${q.reward} e +100 pontos!`;
                feedbackEl.classList.add("bg-emerald-500/20", "text-emerald-300", "border", "border-emerald-500/30");
            } else {
                // Consequência Negativa
                money = Math.max(0, money - 50); // Penalização suave
                feedbackEl.innerText = `Incorreto! Perdeu $50. A resposta certa era: "${q.options[q.correct]}"`;
                feedbackEl.classList.add("bg-rose-500/20", "text-rose-300", "border", "border-rose-500/30");
            }

            // Atualizar os recursos no painel
            updateUI();

            // Avançar para a próxima pergunta de forma contínua
            currentQuizIndex = (currentQuizIndex + 1) % questions.length;

            // Renderizar nova pergunta
            renderQuiz();
        }

        // --- INICIALIZAÇÃO IMEDIATA ---
        updateUI();
        renderQuiz();
    </script>
</body>
</html>
